<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111827" />
    <link rel="manifest" href="/manifest.json" />
    <title>Saas App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
      html, body {
        height: 100%;
      }
      #root {
        min-height: 100%;
        display: flex;
        flex-direction: column;
      }
      body {
        font-family: 'Figtree', sans-serif;
        line-height: 1.4; /* Body 140% */
        letter-spacing: 0; /* Body 0% */
      }
      /* Scrollbars hidden everywhere (still scrollable — only the visible
         bar is removed) — scrollbar-width:none is the standard Firefox
         property, ::-webkit-scrollbar{display:none} covers Chrome/Safari/
         Edge, and -ms-overflow-style covers old Edge/IE. */
      * {
        scrollbar-width: none;
        -ms-overflow-style: none;
      }
      ::-webkit-scrollbar {
        display: none;
        width: 0;
        height: 0;
      }
      /* Hide the native up/down spinner on any remaining type="number"
         input across the app (Chrome/Safari/Edge + Firefox) — most price/
         quantity fields already use type="text" with digit+dot filtering
         instead, but this is a safety net for any that don't. */
      input[type="number"]::-webkit-outer-spin-button,
      input[type="number"]::-webkit-inner-spin-button {
        -webkit-appearance: none;
        margin: 0;
      }
      input[type="number"] {
        -moz-appearance: textfield;
      }
      @keyframes fade-in {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      .animate-fade-in {
        animation: fade-in 0.3s ease-in-out;
      }
      @keyframes fade-in-down {
        0% {
            opacity: 0;
            transform: translateY(-20px);
        }
        100% {
            opacity: 1;
            transform: translateY(0);
        }
      }
      .animate-fade-in-down {
        animation: fade-in-down 0.4s ease-out forwards;
      }
    </style>
  <script type="importmap">
{

    "react/": "https://aistudiocdn.com/react@^19.2.0/",

    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.554.0"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>

</body>
</html>
