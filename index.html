<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111827" />
    <link rel="manifest" href="/manifest.json" />
    <title>Saas App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
      html, body {
        height: 100%;
      }
      #root {
        min-height: 100%;
        display: flex;
        flex-direction: column;
      }
      body {
        font-family: 'Figtree', sans-serif;
        line-height: 1.4; /* Body 140% */
        letter-spacing: 0; /* Body 0% */
      }
      /* Custom scrollbar for neatness.
         Firefox (and some Edge/Windows configurations) ignore the
         WebKit-only ::-webkit-scrollbar rules below entirely and fall back
         to the OS's own wide, square-cornered scrollbar, which visually
         breaks out of any rounded-corner (rounded-lg/xl) container it sits
         inside — the scrollbar-width/scrollbar-color properties are the
         standard, cross-browser equivalent that keeps it thin everywhere. */
      * {
        scrollbar-width: thin;
        scrollbar-color: #c1c1c1 #f1f1f1;
      }
      .dark * {
        scrollbar-color: #4b5563 #1f2937;
      }
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #f1f1f1;
        border-radius: 3px;
      }
      .dark ::-webkit-scrollbar-track {
        background: #1f2937;
      }
      ::-webkit-scrollbar-thumb {
        background: #c1c1c1;
        border-radius: 3px;
      }
      .dark ::-webkit-scrollbar-thumb {
        background: #4b5563;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #a8a8a8;
      }
      .dark ::-webkit-scrollbar-thumb:hover {
        background: #6b7280;
      }
      /* Hide the native up/down spinner on any remaining type="number"
         input across the app (Chrome/Safari/Edge + Firefox) — most price/
         quantity fields already use type="text" with digit+dot filtering
         instead, but this is a safety net for any that don't. */
      input[type="number"]::-webkit-outer-spin-button,
      input[type="number"]::-webkit-inner-spin-button {
        -webkit-appearance: none;
        margin: 0;
      }
      input[type="number"] {
        -moz-appearance: textfield;
      }
      @keyframes fade-in {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      .animate-fade-in {
        animation: fade-in 0.3s ease-in-out;
      }
      @keyframes fade-in-down {
        0% {
            opacity: 0;
            transform: translateY(-20px);
        }
        100% {
            opacity: 1;
            transform: translateY(0);
        }
      }
      .animate-fade-in-down {
        animation: fade-in-down 0.4s ease-out forwards;
      }
    </style>
  <script type="importmap">

    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.554.0"
  }
}
</script>

</head>

</html>
